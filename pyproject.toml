[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localapi"
version = "0.1.0"
description = "Turn any Python function into a local HTTP API with zero boilerplate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/localapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
