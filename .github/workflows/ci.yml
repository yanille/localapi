name: CI

on:
  # main only changes through pull requests (branch ruleset), and this tests each
  # PR merged into main, so push runs would be duplicates. Also covers PRs from forks.
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab, for testing any branch by hand

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
